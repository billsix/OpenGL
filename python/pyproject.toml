[project]
name = "mcnopper"
version = "0.1.0"
authors = [{name = "William Emerison Six", email = "billsix@gmail.com"}]
description = "Python port of Norbert Nopper's OpenGL 4 examples (52 demos)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

dynamic = ["dependencies"]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Education",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle each demo's shaders (and any per-example textures). The large shared
# media set (meshes/HDRs/sponza/glTF) is NOT bundled here: in this repo the demos
# read it from the sibling Binaries/ folder via MCNOPPER_MEDIA (see README), so it
# is not duplicated. The glus_shaders/ dir is matched explicitly since it is not
# under example*/ (only the four shader-bearing demos — 13, 48, 49, 50 — are
# still nested; the rest are flat example*.py modules with no co-located shaders).
"mcnopper" = [
    "example*/**/*.glsl",
    "example*/**/*.comp",
    "example*/**/*.tga",
    "glus_shaders/*.glsl",
]

[project.scripts]
mcnopper = "mcnopper.cli:main"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
# The minimal, ports-friendly selection (ruff default E4/E7/E9/F plus T201 for
# stray prints), matching the sibling ports (sb7code, openglredbook9). Explicit
# `select`, not `extend-select` (the latter with no base select pulls in the
# whole catalogue in ruff 0.16). This table is this port's one source of truth
# for ruff -- this standalone repo has no repo-root config to inherit from.
select = ["E4", "E7", "E9", "F", "T201"]
